[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nablamath"
version = "0.1.0a1"
description = "Núcleo experimental de cálculo rastreável do NablaMath"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "NablaMath contributors"}]
dependencies = []

[project.optional-dependencies]
cloud = ["huggingface_hub>=0.25,<2"]

[project.scripts]
nabla = "nablamath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nablamath.desktop" = ["index.html"]
