name: Curated dataset publication
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  publish:
    if: ${{ secrets.HF_TOKEN != '' && vars.NABLA_DATASET_REPO != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Explain publication boundary
        run: echo "A publicação requer snapshot curado, licença e credencial configurados pelo mantenedor."
