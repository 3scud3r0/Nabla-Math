name: Curated dataset publication
on:
  push:
    paths: ['datasets/**', 'services/publisher/**', '.github/workflows/dataset-publish.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Explain publication boundary
        run: echo "Nenhum upload automático: snapshot curado, licença, repositório e credencial devem ser configurados pelo mantenedor."
